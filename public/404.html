<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Strona nie istnieje — Gliwicki Klub Strzelecki</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .error-page{min-height:100svh;display:grid;place-items:center;padding:48px 5.5%;text-align:center}
    .error-page .code{font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;font-size:clamp(96px,18vw,220px);line-height:.85;letter-spacing:-4px;color:#e7535c;margin:0}
    .error-page h1{font-size:clamp(32px,4vw,56px);margin:18px 0 12px}
    .error-page p{max-width:520px;margin:0 auto 32px;color:var(--muted)}
  </style>
</head>
<body>
  <main class="error-page">
    <div>
      <p class="code">404</p>
      <h1>Ta strona nie istnieje</h1>
      <p>Adres mógł się zmienić lub zawierać błąd. Wróć na stronę główną klubu.</p>
      <a class="button" href="/">Strona główna <span>↗</span></a>
    </div>
  </main>
</body>
</html>
